[project]
name = "cv-screener"
version = "0.1.0"
description = "Synthetic CV generation, field + semantic search and a grounded CLI agent"
requires-python = ">=3.11"
dependencies = [
  "pydantic-ai-slim[openrouter]>=2.44,<3",
  "openai>=3.14,<4",
  "chromadb==1.5.9",
  "pymupdf>=1.24",
  "weasyprint>=62,<71",
  "jinja2>=3.1",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13",
  "python-dotenv>=1.0",
  "pyyaml>=6",
  "pycountry>=24.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cvs = "cv_screener.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cv_screener"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # evals/ is imported by tests but not packaged
